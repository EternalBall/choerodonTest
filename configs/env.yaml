baseURL: ${ENV.BASE_URL}

auth:
  mode: storageState   # storageState | eachCase | skip
  statePath: playwright/.auth/user.json
  login:
    path: /oauth/login
    username: ${ENV.TEST_USER}
    password: ${ENV.TEST_PASS}
    # 登录成功后的可见文案；留空则只判断 URL 离开 /oauth/login
    ready: ""
  role:
    enabled: true
    # 三选一（也可用 .env：TEST_ROLE_ID / TEST_ROLE_CODE / TEST_ROLE）
    id: ${ENV.TEST_ROLE_ID}
    name: ${ENV.TEST_ROLE}
    code: ${ENV.TEST_ROLE_CODE}
    # 接口路径（相对 BASE_URL）；switch 中 {roleId} 会被替换
    listPath: /api/iam/hzero/v1/member-roles/self-roles?lang=zh_CN&organizationId=0&roldId=1&unionLabel=false
    switchPath: /api/iam/v1/users/roles?roleId={roleId}

defaults:
  gotoWaitUntil: domcontentloaded
  timeoutMs: 30000
