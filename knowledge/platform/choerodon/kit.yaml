# Choerodon / HZero 平台组件定位库
# 同组件 DOM 在本系统内一致；禁止用逗号并集（会触发 Playwright strict mode）
# 生成 elements 时以此为底，功能层只覆盖业务字段

pageReady:
  css: .hmes-style
  note: 页面根；勿写 .hmes-style, .c7n-pro-table-wrapper

# ---------- Table 壳 / 分页 / 勾选 / 工具栏（见 playbooks/choerodon-table.md）----------
table:
  css: .c7n-pro-table.c7n-pro-table-bordered
  note: 外层是 div.c7n-pro-table，勿再写 ", table"

tableWrapper:
  css: .c7n-pro-table-wrapper
  note: 含 queryBar + toolbar + 表 + 分页；多表时功能层再收窄

tableBody:
  css: .c7n-pro-table-tbody

tableRow:
  css: .c7n-pro-table-row

tableEmpty:
  text: 暂无数据
  note: 列表/子表空态文案；断言用 assertTableEmpty / assertTableHasRows

tableSpin:
  css: .c7n-spin-spinning, .ant-spin-spinning

pagination:
  css: .c7n-pro-table-pagination
  note: nav 包装；内部为 .c7n-pro-pagination-*

paginationNext:
  css: .c7n-pro-table-pagination .c7n-pro-pagination-pager-next
  note: icon navigate_next；翻页后等 tableSpin

paginationPrev:
  css: .c7n-pro-table-pagination .c7n-pro-pagination-pager-prev

paginationFirst:
  css: .c7n-pro-table-pagination .c7n-pro-pagination-pager-first

paginationLast:
  css: .c7n-pro-table-pagination .c7n-pro-pagination-pager-last

paginationSizeChanger:
  css: .c7n-pro-table-pagination .c7n-pro-pagination-size-changer
  note: 改 pageSize 会回到第 1 页并 query

paginationPageInfo:
  css: .c7n-pro-table-pagination .c7n-pro-pagination-page-info

tableToolbar:
  css: .c7n-pro-table-toolbar
  note: Table.buttons；与页头 createBtn、行编辑 thead icon-add 区分

tableToolbarBtnGroup:
  css: .c7n-pro-table-toolbar .c7n-pro-table-toolbar-button-group

tableSelectionColumn:
  css: .c7n-pro-table-selection-column
  note: selectionMode=rowbox 等；表头=全选，tbody=行勾选

tableRowCheckbox:
  css: .c7n-pro-table-tbody tr.c7n-pro-table-row .c7n-pro-table-selection-column .c7n-pro-checkbox-inner
  note: 多行时 nth 或 within 行

tableHeaderCheckbox:
  css: .c7n-pro-table thead .c7n-pro-table-selection-column .c7n-pro-checkbox-inner
  note: 全选当前页

tableSelectionTips:
  css: .c7n-pro-table-selection-tips

tableExpandIcon:
  css: .c7n-pro-table-expand-icon
  note: mode=tree 或可展开行；非侧栏 .c7n-tree

filterBar:
  css: .c7n-pro-table-dynamic-filter-bar

addFilter:
  css: .c7n-pro-table-add-fields

filterPopup:
  css: .c7n-pro-dropdown-popup .c7n-pro-table-filter-list

filterSearch:
  css: '.c7n-pro-table-filter-list input.c7n-pro-input[placeholder="搜索过滤条件"]'

searchBtn:
  css: .c7n-pro-table-filter-menu-query
  note: filterBar 查询是 refresh 图标，不是文案「查询」

resetBtn:
  role: button
  name: 重置

createBtn:
  role: button
  name: 新建

# 详情只读态（canEdit=false）
detailReady:
  role: button
  name: 编辑

editBtn:
  role: button
  name: 编辑

# 新建 / 点编辑后的可写态（页头保存；勿仅依赖 .page-head-operator，站点分配等页结构可能不同）
formReady:
  css: .page-head button:has(.icon-save)

editReady:
  css: .page-head button:has(.icon-save)

submitBtn:
  css: .page-head button:has(.icon-save)

saveBtn:
  css: .page-head button:has(.icon-save)
  note: 也可用 role=button name=保存；功能层可覆盖

cancelBtn:
  role: button
  name: 取消

successToast:
  text: 成功

detailLink:
  css: .c7n-pro-table-tbody td a
  note: 列表行链接；业务层可覆盖为具体 data-index；点击时用 exactText

copyBtn:
  role: button
  name: 复制

siteAssignmentBtn:
  role: button
  name: 站点分配
  note: 详情页头；须先进详情

extendAttrBtn:
  role: button
  name: 扩展属性

# Choerodon Pro Modal / Drawer（同一组件；详见 knowledge/playbooks/choerodon-modal.md）
# 容器 .c7n-pro-modal-container 常驻；用 .c7n-pro-modal-active 判断打开（勿用 role=dialog）

# 居中 Modal（drawer:false；排除抽屉以免点到侧栏）
modal:
  css: .c7n-pro-modal-wrapper.c7n-pro-modal-active:not(.c7n-pro-modal-drawer)
  note: 打开态居中弹层；关闭后可能 hidden 或销毁

modalTitle:
  css: .c7n-pro-modal-wrapper.c7n-pro-modal-active:not(.c7n-pro-modal-drawer) .c7n-pro-modal-title

modalBody:
  css: .c7n-pro-modal-wrapper.c7n-pro-modal-active:not(.c7n-pro-modal-drawer) .c7n-pro-modal-body

modalConfirm:
  css: .c7n-pro-modal-wrapper.c7n-pro-modal-active:not(.c7n-pro-modal-drawer) .c7n-pro-modal-footer button.c7n-pro-btn-primary
  note: okText 默认「确定」；也可用 role=button name=确定（限 within modal）

modalCancel:
  css: .c7n-pro-modal-wrapper.c7n-pro-modal-active:not(.c7n-pro-modal-drawer) .c7n-pro-modal-footer button.c7n-pro-btn-default

modalClose:
  css: .c7n-pro-modal-wrapper.c7n-pro-modal-active .c7n-pro-modal-header-button
  note: 需 closable:true；居中/抽屉共用

# Drawer（drawer:true）
drawer:
  css: .c7n-pro-modal-wrapper.c7n-pro-modal-drawer.c7n-pro-modal-active
  note: 未打开时仅有 modal-container + mask[hidden]

drawerTitle:
  css: .c7n-pro-modal-wrapper.c7n-pro-modal-drawer.c7n-pro-modal-active .c7n-pro-modal-title

drawerBody:
  css: .c7n-pro-modal-wrapper.c7n-pro-modal-drawer.c7n-pro-modal-active .c7n-pro-modal-body

drawerConfirm:
  css: .c7n-pro-modal-wrapper.c7n-pro-modal-drawer.c7n-pro-modal-active .c7n-pro-modal-footer button.c7n-pro-btn-primary

drawerCancel:
  css: .c7n-pro-modal-wrapper.c7n-pro-modal-drawer.c7n-pro-modal-active .c7n-pro-modal-footer button.c7n-pro-btn-default

copyDrawer:
  css: '.c7n-pro-modal-wrapper.c7n-pro-modal-drawer.c7n-pro-modal-active:has(.c7n-pro-modal-title:text-is("复制"))'
  note: 功能层可覆盖标题；字段用 input[name]

# Modal.confirm / info / success / error / warning
confirmModal:
  css: .c7n-pro-modal-wrapper.c7n-pro-confirm-wrapper.c7n-pro-modal-active
  note: 与业务表单 Modal、Popconfirm（.c7n-popover）区分

confirmModalOk:
  css: .c7n-pro-modal-wrapper.c7n-pro-confirm-wrapper.c7n-pro-modal-active .c7n-pro-modal-footer button.c7n-pro-btn-primary

# ---------- Lov（见 playbooks/choerodon-lov.md）----------
lovDialog:
  css: .c7n-pro-modal-wrapper.c7n-pro-modal-active
  note: 默认 viewMode=modal/drawer；打开态；禁止逗号并集；功能层可再收窄

lovConfirm:
  role: button
  name: 确定

lovPopup:
  css: .c7n-pro-select-lov-popup
  note: viewMode=popup；内含 Table；勿与 .c7n-pro-select-popup（Select 菜单）混淆

lovOpen:
  css: .c7n-pro-select-wrapper .icon-search
  note: 功能层必须 :has(input[name=字段])；行内见 tableLovOpen

# ---------- 表格行编辑模式（Table editor + 增删行）----------
# 典型：页头点「编辑」后 canEdit=true；表头加号增行、行内 Lov/Switch、行首删除 + Popconfirm
# 与页头「新建」createBtn 不同；与只读页 row_action（Radio 直调 API）也不同
# 详见 knowledge/playbooks/choerodon-table-row-edit.md

tableAddLineBtn:
  css: .c7n-pro-table thead button:has(.icon-add)
  note: 表头加号；若 within 已指向某表，改用相对选择器 thead button:has(.icon-add)

tableRemoveLineBtn:
  css: .c7n-pro-table-tbody tr.c7n-pro-table-row button:has(.icon-remove)
  note: 行首删除；within 表根时用 tbody tr.c7n-pro-table-row button:has(.icon-remove)

tableDeletePopover:
  css: .c7n-popover .c7n-popover-inner-content
  note: 文案常为「是否删除此条记录？」

tableDeleteConfirm:
  css: .c7n-popover .c7n-popover-buttons .c7n-btn-primary
  note: Popconfirm 确定

tableDeleteCancel:
  css: .c7n-popover .c7n-popover-buttons .c7n-btn:not(.c7n-btn-primary)
  note: Popconfirm 取消

tableEditableRequiredCell:
  css: .c7n-pro-table-cell-inner-editable.c7n-pro-table-cell-inner-required
  note: 行内可编辑必填格（展示层）；点此激活 TableEditor，此时通常还没有 icon-search

tableEmptyRow:
  css: .c7n-pro-table-empty-row
  note: 空表占位行；增行后变为 .c7n-pro-table-row

# 行内 Lov：点格激活后，编辑器浮层上的搜索图标（勿写在 td 内）
# 详见 playbooks/choerodon-table-row-edit.md「行内 Lov 展示方式」
tableLovOpen:
  css: .c7n-pro-select-wrapper:has(input.c7n-pro-input) .icon-search
  note: 须先 click 可编辑格；功能层建议 :has(input[name=具体字段])

# 行内操作列：无 href 的 <a onClick>（勿用 role=link）
tableActionLink:
  css: .action-link a
  note: 见 playbooks/choerodon-table-row-edit.md「行内操作列」

# ---------- Select / Lookup（非 Lov；见 playbooks/choerodon-select.md）----------
selectWrapper:
  css: .c7n-pro-select-wrapper
  note: 功能层用 :has(input[name=字段])；Lov 也是 select-wrapper 但后缀多为 icon-search

selectTrigger:
  css: .c7n-pro-select-wrapper .c7n-pro-select-trigger
  note: 下拉箭头；Lov 勿用此键，用 lov 搜索图标

selectPopup:
  css: .c7n-pro-select-popup
  note: 打开态下拉；选项在 .c7n-pro-select-dropdown-menu 内；关键字 pickSelect 默认 first:true 点第一项

# ---------- DatePicker（前缀 calendar；见 playbooks/choerodon-date-picker.md）----------
datePickerWrapper:
  css: .c7n-pro-calendar-picker-wrapper

datePickerSuffix:
  css: .c7n-pro-calendar-picker-wrapper .c7n-pro-calendar-picker-suffix

datePickerPopup:
  css: .c7n-pro-calendar-picker-popup

datePickerCell:
  css: .c7n-pro-calendar-picker-popup .c7n-pro-calendar-cell-inner
  note: 避开 .c7n-pro-calendar-disabled

# ---------- Table QueryBar（见 playbooks/choerodon-table-queryBar.md）----------
professionalQueryBar:
  css: .c7n-pro-table-professional-query-bar

professionalQueryBtn:
  role: button
  name: 查询
  note: within professionalQueryBar；与 filterBar 的 refresh 图标查询不同

professionalResetBtn:
  role: button
  name: 重置
  note: within professionalQueryBar

professionalMoreBtn:
  role: button
  name: 更多
  note: 展开超出 queryFieldsLimit 的字段

advancedQueryBar:
  css: .c7n-pro-table-advanced-query-bar

advancedQueryBtn:
  role: button
  name: 高级查询
  note: 打开 drawer Modal；见 choerodon-modal.md

# ---------- 行内更多 Dropdown（见 playbooks/choerodon-row-dropdown.md）----------
dropdownMenu:
  css: .c7n-dropdown-menu:not(.c7n-dropdown-menu-hidden)
  note: 与 filter 的 .c7n-pro-dropdown-popup 区分

dropdownMenuItem:
  css: .c7n-dropdown-menu:not(.c7n-dropdown-menu-hidden) .c7n-dropdown-menu-item

rowMoreTrigger:
  role: button
  name: 更多
  note: 功能层建议 within 行；文案也可能是「操作」

# ---------- Upload / Attachment（见 playbooks/choerodon-upload.md）----------
uploadInput:
  css: .c7n-pro-upload-select input[type="file"]
  note: Playwright 用 setInputFiles；勿依赖系统文件框

uploadListItem:
  css: .c7n-pro-upload-list-item

attachmentRoot:
  css: .c7n-pro-attachment

attachmentListItem:
  css: .c7n-pro-attachment-list-item

attachmentDrag:
  css: .c7n-pro-attachment-drag

# ---------- Tabs（c7n-tabs 非 pro；见 playbooks/choerodon-tabs.md）----------
tabsRoot:
  css: .c7n-tabs

tabsTab:
  css: .c7n-tabs-tab

tabsTabActive:
  css: .c7n-tabs-tab-active

tabPaneActive:
  css: .c7n-tabs-tabpane:not(.c7n-tabs-tabpane-inactive)

# ---------- Tree / TreeSelect / Cascader（见 playbooks/choerodon-tree.md）----------
treeRoot:
  css: .c7n-tree

treeSwitcher:
  css: .c7n-tree-switcher:not(.c7n-tree-switcher-noop)

treeNodeContent:
  css: .c7n-tree-node-content-wrapper

treeNodeSelected:
  css: .c7n-tree-node-content-wrapper.c7n-tree-node-selected

treeSelectWrapper:
  css: .c7n-pro-tree-select-wrapper

treeSelectPopup:
  css: .c7n-pro-tree-select-popup

cascaderWrapper:
  css: .c7n-pro-cascader-wrapper

cascaderMenu:
  css: .c7n-pro-cascader-menu

cascaderMenuItem:
  css: .c7n-pro-cascader-menu-item

# ---------- choerodon-text-input（见 playbooks/choerodon-text-input.md）----------
textFieldInput:
  css: input.c7n-pro-input
  note: 单行文本通用输入框；与 Select/Lov/Intl/AutoComplete 同类，功能层须 within 字段或加 [name=]

textFieldClearBtn:
  css: .c7n-pro-input-clear-button
  note: 需 clearButton 且有值；within 字段 wrapper。清空不能用 fill 空串

textFieldLengthInfo:
  css: .c7n-pro-input-length-info
  note: showLengthInfo 时的字数提示（TextField.tsx:952）

textFieldValidationTip:
  css: .c7n-pro-validation-message
  note: 字段校验提示（field/utils.tsx:560）；文案需在功能层用 within 收窄

textAreaInput:
  css: textarea.c7n-pro-textarea
  note: 多行文本；与 Mentions 的 textarea.c7n-pro-mentions 区分；功能层加 [name=] 或 within。fillForm 文本回退对其无效

textAreaWrapper:
  css: .c7n-pro-textarea-wrapper
  note: TextArea 外层，作为 within 根

passwordInput:
  css: input.c7n-pro-password
  note: 密码输入框；不含 -fix-autofill 隐藏域（类名不同）；功能层加 [name=]

passwordRevealBtn:
  css: .c7n-pro-password-inner-button
  note: 眼睛按钮；reveal=false 或禁用时不存在（Password.tsx:52-62）

passwordRevealOn:
  css: .c7n-pro-password-inner-button .icon-visibility
  note: 明文显示态；隐藏态图标为 icon-visibility_off

emailFieldInput:
  css: input.c7n-pro-input[type="email"]
  note: 邮箱输入框；功能层加 [name=] 收窄

emailFieldInvalidTip:
  text: 请输入有效的邮箱地址。
  note: zh_CN type_mismatch 文案（locale-context/zh_CN.tsx:245）；仅作断言参照，语言切换后失效

urlFieldInput:
  css: input.c7n-pro-input[type="url"]
  note: 网址输入框；功能层加 [name=] 收窄

urlFieldInvalidTip:
  text: 请输入有效的网址。
  note: zh_CN type_mismatch 文案（locale-context/zh_CN.tsx:308）；仅作断言参照，语言切换后失效

intlFieldIcon:
  css: .c7n-pro-input-suffix .icon-language
  note: 多语言入口，点击打开 Modal；须 within 字段 wrapper

intlFieldLangInput:
  css: .c7n-pro-modal-wrapper.c7n-pro-modal-active .c7n-pro-modal-body input.c7n-pro-input
  note: 多语言弹窗内语言行；多行时为 textarea.c7n-pro-textarea；功能层按 name 收窄（tlsKey 待核实）

secretFieldWrapper:
  css: .c7n-pro-input-wrapper.c7n-pro-input-secret
  note: 脱敏字段外层，within 表单项

secretFieldEmpty:
  css: .c7n-pro-input-secret-empty
  note: 只读且空值时的占位（SecretField.tsx:206）

secretFieldEditBtn:
  css: .c7n-pro-input-suffix .icon-edit-o
  note: 可编辑态入口；within 字段 wrapper

secretFieldViewBtn:
  css: .c7n-pro-input-suffix .icon-visibility-o
  note: 只读未查看入口；within 字段 wrapper

secretFieldModal:
  css: .c7n-pro-modal-wrapper.c7n-pro-modal-active:has(.c7n-pro-secret-field-modal)
  note: 脱敏验证/编辑弹窗；footer 为 null，按钮在表单内

secretFieldModalForm:
  css: .c7n-pro-secret-field-modal-form
  note: 弹窗内表单，within 弹窗

secretFieldVerifyBtn:
  css: .c7n-pro-secret-field-modal-verify-btn
  note: 获取验证码，会触发后端请求（CountDownButton.tsx:23）

secretFieldSlider:
  css: .c7n-pro-secret-field-simple-verify-bar
  note: 滑块验证条；拖拽当前无关键字支持，需测试环境跳过（待核实）

secretFieldNextBtn:
  css: .c7n-pro-secret-field-modal-raised-btn
  note: 验证阶段主按钮：编辑时为「下一步」，查看时为「确定」（SecretFieldView.tsx:390/399）

secretFieldConfirmBtn:
  css: .c7n-pro-secret-field-modal-edit-btns button:last-child
  note: 编辑阶段「确定」（SecretFieldView.tsx:414）；按位置定位，class 未在源码中确认

autoCompleteInput:
  css: input.c7n-pro-auto-complete
  note: 自动补全输入框；功能层加 [name=] 或 within 字段

autoCompleteClearBtn:
  css: .c7n-pro-auto-complete-clear-button
  note: 需有值；within 字段 wrapper

autoCompletePopup:
  css: .c7n-pro-auto-complete-popup-single
  note: 单选弹层；多选为 -popup-multiple（Select.tsx:1099）

autoCompleteMenu:
  css: .c7n-pro-auto-complete-dropdown-menu
  note: 选项容器（Select.tsx:791）；选项用 exactText 收窄

mentionsInput:
  css: textarea.c7n-pro-mentions
  note: 提及输入框；与 TextArea 的 textarea.c7n-pro-textarea 区分；功能层加 [name=] 或 within

mentionsWrapper:
  css: .c7n-pro-mentions-wrapper
  note: Mentions 外层，作为 within 根

# ---------- choerodon-number-input（见 playbooks/choerodon-number-input.md）----------
# 数值类输入（NumberField / Currency / PercentField / Range）建议新增定位键
# 来源：knowledge/playbooks/choerodon-number-input.md；未并入 platform/choerodon/kit.yaml

numberFieldWrapper:
  css: '.c7n-pro-input-number-wrapper'
  note: '功能层用 :has(input[name=字段]) 收窄；Currency、PercentField 共用此 DOM'

numberFieldInput:
  css: 'input.c7n-pro-input-number'
  note: '功能层用 input[name=字段] 定位；Currency 同 DOM，需靠字段定义区分'

numberFieldSuffix:
  css: '.c7n-pro-input-number-suffix'
  note: '后缀，如 % 或单位'

numberFieldPlus:
  css: '.c7n-pro-input-number-inner-button .c7n-pro-input-number-plus'
  note: '仅设置 step 且可编辑时出现'

numberFieldMinus:
  css: '.c7n-pro-input-number-inner-button .c7n-pro-input-number-minus'
  note: '仅设置 step 且可编辑时出现'

numberFieldClearButton:
  css: '.c7n-pro-input-number-clear-button'
  note: '无 step 且可清空时出现'

percentFieldWrapper:
  css: '.c7n-pro-input-number-wrapper.c7n-pro-input-number-percentage'
  note: 'PercentField 专属外层类；功能层再用 :has(input[name=字段]) 收窄'

rangeWrapper:
  css: '.c7n-pro-range-wrapper'
  note: 'Range 无 input，用此键定位；多个时在表单项或行内 within'

rangeHandle:
  css: '.c7n-pro-range-handle'
  note: '双滑块时为 2 个，用 nth 或 within'

rangeTrack:
  css: '.c7n-pro-range-track'
  note: '已选段'

rangeMarkText:
  css: '.c7n-pro-range-mark-text'
  note: '仅设置 marks 时存在'

# ---------- choerodon-check-radio-switch（见 playbooks/choerodon-check-radio-switch.md）----------
# 建议新增 kit 键（来源：knowledge/playbooks/choerodon-check-radio-switch.md）
# 待人工合并进 platform/choerodon/kit.yaml；功能层按字段/选项用 :has / hasText 收窄

checkBoxWrapper:
  css: .c7n-pro-checkbox-wrapper
  note: '功能层用 :has(input[name=字段][value=…]) 收窄；hasText 选文案'

checkBoxChecked:
  css: input.c7n-pro-checkbox:checked
  note: '仅配合 assert visible（间接断言）；须收窄'

checkBoxIndeterminate:
  css: .c7n-pro-checkbox-wrapper.c7n-pro-checkbox-indeterminate

radioWrapper:
  css: .c7n-pro-radio-wrapper
