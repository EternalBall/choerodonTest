# Playbook 按需注入映射（loadPlaybooks.selectPlaybooks 读取）
# 按被测源码的 import 来源选手册：
#   from 'choerodon-ui/pro' 或 'choerodon-ui/pro/lib/<dir>'  → pro 映射
#   from 'choerodon-ui'     或 'choerodon-ui/lib/<dir>'      → legacy 映射
# 组件键按「去掉连字符、忽略大小写」匹配导出名或 lib 目录名（DatePicker = date-picker）。
# 导出名来源：choerodon-ui@06b0d84 components-pro/index.tsx、components/index.tsx。

# 通用手册：与组件库无关，始终注入
always:
  - page-states
  - api-binding
  - row-action
  - choerodon-create-detail

# 源码里没识别出任何 choerodon-ui 导入时（如经业务封装组件引入）注入的兜底集
fallback:
  - choerodon-table
  - choerodon-table-filterBar
  - choerodon-select
  - choerodon-lov
  - choerodon-modal

# 源码出现这些 DataSet 字段属性时，视同使用对应 Pro 组件
